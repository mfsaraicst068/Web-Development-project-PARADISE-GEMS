<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise Gems | Sri Lanka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --royal-blue: #002d62;
            --gold: #d4af37;
        }

        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar { 
            background-color: var(--royal-blue);
            transition: all 0.4s ease;
        }

        /* Hero Section Animation Classes */
        .hero-section { 
            flex: 1;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1573408301185-9146fe634ad0?q=80&w=2069&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 100px 0;
        }

        /* Initial state for animations (මුලින් නොපෙනී තිබීම) */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.2s ease-out;
        }

        /* Active state for animations (පසුව මතුවීම) */
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-section h1 {
            color: var(--gold) !important;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            letter-spacing: 3px;
        }

        .btn-gold {
            background-color: var(--gold);
            color: white;
            border: none;
            transition: 0.4s ease;
        }

        .btn-gold:hover {
            background-color: #fff;
            color: var(--royal-blue);
            transform: scale(1.1);
        }

        .footer { 
            background-color: #111; 
            color: white; 
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">💎 PARADISE GEMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-uppercase">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Shop Gems</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-2 fw-bold reveal">Paradise Gems</h1>
            <p class="lead mb-4 reveal">The purest Sapphires and Rubies from the heart of Sri Lanka.</p>
            <div class="reveal">
                <a href="product.html" class="btn btn-gold btn-lg px-5">Discover Collection</a>
            </div>
        </div>
    </header>

    <footer class="footer text-center">
        <div class="container">
            <p>© 2026 Paradise Gems Sri Lanka. All Rights Reserved.</p>
            <small style="color: #777;">Developed by The Confused Geniuses</small>
        </div>
    </footer>

    <script>
        window.addEventListener('load', () => {
            
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach((el, index) => {
                setTimeout(() => {
                    el.classList.add('active');
                }, 300 * index);
            });
        });

      
        window.onscroll = function() {
            const nav = document.getElementById('mainNav');
            if (window.pageYOffset > 50) {
                nav.style.backgroundColor = "rgba(0, 45, 98, 0.9)"; 
                nav.style.padding = "5px 0";
            } else {
                nav.style.backgroundColor = "var(--royal-blue)";
                nav.style.padding = "15px 0";
            }
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
