<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Paradise Gems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --blue: #002366; --gold: #D4AF37; }
        
        body { 
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .navbar { background-color: var(--blue); border-bottom: 2px solid var(--gold); }
        .navbar-brand, .nav-link { color: var(--gold) !important; }

        /* Animation for page load */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .fade-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Glassmorphism Contact Form */
        .contact-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            transition: transform 0.3s ease;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .btn-submit {
            background: var(--blue);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.4s;
        }

        .btn-submit:hover {
            background: var(--gold);
            transform: scale(1.02);
        }

        /* Success Message Styling */
        #success-container {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: var(--gold);
            stroke-miterlimit: 10;
            margin: 10% auto;
            box-shadow: inset 0px 0px 0px var(--gold);
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 30px transparent; } }

        .info-box {
            color: var(--blue);
            padding: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">PARADISE GEMS</a>
        <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="nav-link" href="signup.html">Sign Up</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 fade-up" id="main-content">
            <div class="contact-card">
                <div id="contact-form-wrapper">
                    <h2 class="text-center mb-4" style="color: var(--blue); font-weight: 800;">Get in Touch</h2>
                    <p class="text-center text-muted mb-5">Inquire about our rare collection or request a private viewing.</p>
                    
                    <form id="enquiryForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@luxury.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Message</label>
                            <textarea class="form-control" rows="4" placeholder="I am interested in the Royal Ceylon Sapphire..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-submit w-100 mt-3">SEND ENQUIRY</button>
                    </form>
                </div>

                <div id="success-container">
                    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" stroke="#D4AF37" stroke-width="2"/>
                        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" stroke="#D4AF37" stroke-width="4"/>
                    </svg>
                    <h3 style="color: var(--blue);">Enquiry Received!</h3>
                    <p class="text-muted">Our gemologist will contact you within 24 hours to discuss your request.</p>
                    <a href="products.html" class="btn btn-outline-secondary btn-sm mt-3">Back to Collection</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Reveal animation on load
    window.addEventListener('load', () => {
        document.getElementById('main-content').classList.add('active');
    });

    // Handle Form Submission
    document.getElementById('enquiryForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const wrapper = document.getElementById('contact-form-wrapper');
        const success = document.getElementById('success-container');

        // Smooth fade out of form
        wrapper.style.transition = "opacity 0.5s ease";
        wrapper.style.opacity = "0";

        setTimeout(() => {
            wrapper.style.display = "none";
            success.style.display = "block";
            // Trigger a slight bounce for the success card
            document.querySelector('.contact-card').style.transform = "scale(1.05)";
            setTimeout(() => {
                document.querySelector('.contact-card').style.transform = "scale(1)";
            }, 300);
        }, 500);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
