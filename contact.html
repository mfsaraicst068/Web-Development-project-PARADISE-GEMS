<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Luxury Gem Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Dark background to make the white gem box pop */
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ambient background texture */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.3;
        }

        .gem-box {
            position: relative;
            z-index: 1;
            /* White Marble / Diamond Effect */
            background: rgba(255, 255, 255, 0.9);
            background-image: url('https://www.transparenttextures.com/patterns/marble-similar.png');
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 500px; /* Slightly larger as requested */
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(255, 255, 255, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #111;
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            color: #555;
            font-size: 15px;
            margin-bottom: 35px;
        }

        /* Form Inputs */
        .input-wrapper {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            color: #111;
        }

        input:focus, textarea:focus {
            border-color: #000;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* The Black Professional Button */
        .send-btn {
            width: 100%;
            background: #000;
            color: #fff;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .send-btn:hover {
            background: #333;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Success Message Styling */
        .hidden { display: none; }
        
        #success-state {
            padding: 20px;
        }
        
        .checkmark {
            font-size: 50px;
            color: #000;
            margin-bottom: 15px;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            display: none;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="gem-box" id="mainContainer">
        <div id="form-ui">
            <h2>Contact Us</h2>
            <p>Inquire about our rare collections.</p>

            <form id="contactForm">
                <div class="input-wrapper">
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-wrapper">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-wrapper">
                    <textarea rows="4" placeholder="Inquiry Details" required></textarea>
                </div>

                <button type="submit" class="send-btn" id="submitBtn">
                    <span id="btn-text">Send Message</span>
                    <div class="spinner" id="btn-spinner"></div>
                </button>
            </form>
        </div>

        <div id="success-state" class="hidden">
            <div class="checkmark">✧</div>
            <h2>Inquiry Sent</h2>
            <p>Our gemologists will reach out to you within 24 hours.</p>
        </div>
    </div>

    <script>
        const contactForm = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('btn-spinner');
        const formUi = document.getElementById('form-ui');
        const successState = document.getElementById('success-state');

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // UI Changes
            btnText.innerText = "Processing...";
            spinner.style.display = "block";
            submitBtn.style.pointerEvents = "none";

            // Simulating API call
            setTimeout(() => {
                formUi.classList.add('hidden');
                successState.classList.remove('hidden');
            }, 2000);
        });
    </script>

</body>
</html>
