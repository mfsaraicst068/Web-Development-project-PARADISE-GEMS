<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Elite | Paradise Gems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --blue: #002366; --gold: #D4AF37; }

        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #fff; }

        /* Navbar */
        .navbar { 
            background-color: var(--blue); 
            border-bottom: 2px solid var(--gold); 
            z-index: 1000;
        }
        .navbar-brand, .nav-link { color: var(--gold) !important; letter-spacing: 1px; }

        .signup-wrapper { 
            display: flex; 
            min-height: calc(100vh - 72px); 
            width: 100%; 
        }

        /* Left Side: Brand Image */
        .brand-side {
            flex: 1.2;
            background: linear-gradient(rgba(0, 35, 102, 0.75), rgba(0, 35, 102, 0.75)), 
                        url('https://images.unsplash.com/photo-1588444839799-eb6bd27e3f20?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .floating-diamond {
            font-size: 4.5rem;
            animation: pulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* Right Side: Form */
        .form-side {
            flex: 1;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 40px;
        }

        .signup-box {
            max-width: 450px;
            width: 100%;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .signup-box.active { opacity: 1; transform: scale(1); }

        .form-control {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .form-control:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
            border-color: var(--gold);
        }

        .btn-signup {
            background: var(--blue);
            color: white;
            border: 2px solid var(--blue);
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 20px;
            transition: 0.4s;
        }

        .btn-signup:hover {
            background: transparent;
            color: var(--blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 35, 102, 0.1);
        }

        .form-check-input:checked {
            background-color: var(--gold);
            border-color: var(--gold);
        }

        @media (max-width: 992px) {
            .brand-side { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">PARADISE GEMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="nav-link" href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>
</nav>

<div class="signup-wrapper">
    <div class="brand-side">
        <div class="floating-diamond">💎</div>
        <h1 class="display-5 fw-bold mt-4" style="color: var(--gold);">JOIN THE LEGACY</h1>
        <p class="lead px-lg-5">Become a verified collector and gain priority access to our newest excavations and rare cuts.</p>
    </div>

    <div class="form-side">
        <div class="signup-box" id="signupBox">
            <h2 class="fw-bold mb-2" style="color: var(--blue);">Membership Application</h2>
            <p class="text-muted mb-4">Start your journey with Paradise Gems.</p>

            <form id="signupForm">
                <div class="row">
                    <div class="col-md-6">
                        <label class="small fw-bold text-uppercase">First Name</label>
                        <input type="text" class="form-control" placeholder="Jane" required>
                    </div>
                    <div class="col-md-6">
                        <label class="small fw-bold text-uppercase">Last Name</label>
                        <input type="text" class="form-control" placeholder="Smith" required>
                    </div>
                </div>

                <div class="mb-2">
                    <label class="small fw-bold text-uppercase">Email Address</label>
                    <input type="email" class="form-control" placeholder="jane.smith@luxury.com" required>
                </div>

                <div class="mb-2">
                    <label class="small fw-bold text-uppercase">Choose Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the <a href="#" style="color: var(--gold);">Terms of Service</a> and privacy policy.
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-signup shadow-sm">CREATE ACCOUNT</button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted">Already a member? <a href="login.html" style="color: var(--gold); font-weight: 600;">Sign In Here</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    // Reveal form with a slight "pop" effect on load
    window.addEventListener('load', () => {
        document.getElementById('signupBox').classList.add('active');
    });

    // Optional: Add a simple thank you alert for demo
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Welcome to Paradise Gems! Your application has been submitted.');
        window.location.href = 'login.html';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
