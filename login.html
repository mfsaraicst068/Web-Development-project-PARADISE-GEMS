<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | Paradise Gems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --blue: #002366; --gold: #D4AF37; }

        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #fff; }

        /* Unified Navbar */
        .navbar { 
            background-color: var(--blue); 
            border-bottom: 2px solid var(--gold); 
            z-index: 1000;
        }
        .navbar-brand, .nav-link { color: var(--gold) !important; letter-spacing: 1px; }

        .login-wrapper { 
            display: flex; 
            height: calc(100vh - 72px); /* Subtracts navbar height */
            width: 100%; 
        }

        /* Left Side: Aesthetic Brand Side */
        .brand-side {
            flex: 1.2;
            background: linear-gradient(rgba(0, 35, 102, 0.7), rgba(0, 35, 102, 0.7)), 
                        url('https://images.unsplash.com/photo-1573408301185-9146fe634ad0?q=80&w=2069&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .gem-icon {
            font-size: 4rem;
            color: var(--gold);
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Right Side: Login Form */
        .form-side {
            flex: 1;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-box {
            max-width: 400px;
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .login-box.active { opacity: 1; transform: translateY(0); }

        .form-control {
            border: none;
            border-bottom: 2px solid #eee;
            border-radius: 0;
            padding: 12px 5px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--gold);
        }

        .btn-login {
            background: var(--blue);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 20px;
            transition: 0.4s;
        }

        .btn-login:hover {
            background: var(--gold);
            color: var(--blue);
            transform: translateY(-2px);
        }

        @media (max-width: 992px) {
            .brand-side { display: none; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">PARADISE GEMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="nav-link" href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>
</nav>

<div class="login-wrapper">
    <div class="brand-side">
        <div class="gem-icon">💎</div>
        <h1 class="display-4 fw-bold mt-3" style="color: var(--gold);">EXCLUSIVITY</h1>
        <p class="lead">Log in to view our private "Vault" collection.</p>
    </div>

    <div class="form-side">
        <div class="login-box" id="loginBox">
            <h2 class="fw-bold mb-2" style="color: var(--blue);">Member Portal</h2>
            <p class="text-muted mb-5">Secure access for our elite collectors.</p>

            <form>
                <div class="mb-3">
                    <label class="small fw-bold text-uppercase">Email Address</label>
                    <input type="email" class="form-control" placeholder="collector@paradise.com" required>
                </div>
                
                <div class="mb-3 position-relative">
                    <label class="small fw-bold text-uppercase">Password</label>
                    <input type="password" class="form-control" id="passwordField" placeholder="••••••••" required>
                    <i class="bi bi-eye position-absolute end-0 top-50 translate-middle-y mt-2" style="cursor: pointer;" id="togglePassword"></i>
                </div>

                <div class="d-flex justify-content-between mb-4 mt-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label small" for="remember">Keep me logged in</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-login shadow-sm">AUTHENTICATE</button>
            </form>

            <div class="text-center mt-5">
                <p class="small text-muted">Not a member? <a href="contact.html" style="color: var(--gold); font-weight: 600;">Apply for Membership</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    // Reveal form on load
    window.addEventListener('load', () => {
        document.getElementById('loginBox').classList.add('active');
    });

    // Toggle Password Visibility
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#passwordField');

    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.classList.toggle('bi-eye');
        this.classList.toggle('bi-eye-slash');
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
